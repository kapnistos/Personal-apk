name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes older runs pointless; this also keeps the release tidy.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Reuse one debug key across runs so each APK installs over the last.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hub-debug-keystore
      - name: Release key from secrets, if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hub.jks"
          echo "HUB_KEYSTORE_PATH=$RUNNER_TEMP/hub.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
        env:
          HUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # arm64 covers every phone from the last several years and is a third of the size.
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Hub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hub-android
          path: Hub.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Hub-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Hub-windows
          path: Hub-windows.zip

  release:
    # Keeps one "latest" release with the newest builds, easy to grab on a phone.
    if: github.event_name == 'push'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.
            Android: download Hub.apk on your phone and open it.
            Windows: unzip Hub-windows.zip and run hub.exe.
          files: |
            Hub.apk
            Hub-windows.zip
